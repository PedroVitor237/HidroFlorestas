openapi: 3.1.0
info:
  title: HidroFlorestas IMP-004 Collection Registration API
  version: 0.1.0
  description: >-
    Contrato mínimo para confirmar e consultar o detalhe imutável de uma coleta
    geral no contexto explícito de laboratório e área. Não define rascunho,
    listagem, atualização, exclusão, medições ambientais ou IHFR.
servers:
  - url: /
security:
  - cookieAuth: []
paths:
  /api/laboratories/{laboratoryId}/areas/{areaId}/collections:
    post:
      operationId: createEnvironmentalCollection
      summary: Confirma uma coleta geral em uma área autorizada
      description: >-
        Revalida sessão, vínculo, papel, laboratório ativo, permissão
        CREATE_COLLECTION e área subordinada. Identificador, autoria e instante
        de confirmação são definidos no servidor. A mesma chave e o mesmo
        conteúdo convergem para o registro já criado.
      parameters:
        - $ref: '#/components/parameters/LaboratoryId'
        - $ref: '#/components/parameters/AreaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionInput'
            examples:
              occurrenceWithOffset:
                summary: Ocorrência com offset explícito de Fortaleza
                value:
                  occurredAt: '2026-09-14T09:30:00-03:00'
      responses:
        '201':
          description: Coleta confirmada e criada atomicamente.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              $ref: '#/components/headers/CollectionLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
              examples:
                created:
                  $ref: '#/components/examples/CollectionSuccess'
        '200':
          description: Replay idempotente; a mesma coleta previamente criada é devolvida sem nova escrita.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              $ref: '#/components/headers/CollectionLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
              examples:
                replay:
                  $ref: '#/components/examples/CollectionSuccess'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/laboratories/{laboratoryId}/areas/{areaId}/collections/{collectionId}:
    get:
      operationId: getEnvironmentalCollection
      summary: Consulta o detalhe de uma coleta geral confirmada
      description: >-
        Revalida o vínculo atual e consulta a coleta simultaneamente pelo
        laboratório, área e identificador. Laboratório inativo continua
        consultável em modo somente leitura.
      parameters:
        - $ref: '#/components/parameters/LaboratoryId'
        - $ref: '#/components/parameters/AreaId'
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Detalhe autorizado da coleta confirmada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
              examples:
                activeLaboratory:
                  $ref: '#/components/examples/CollectionSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token

  parameters:
    LaboratoryId:
      name: laboratoryId
      in: path
      required: true
      description: Identificador opaco contextual; não concede acesso isoladamente.
      schema:
        type: string
        format: uuid
      example: 10000000-0000-4000-8000-000000000001
    AreaId:
      name: areaId
      in: path
      required: true
      description: Identificador opaco da área subordinada ao laboratório contextual.
      schema:
        type: string
        format: uuid
      example: 20000000-0000-4000-8000-000000000001
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Identificador público opaco da coleta no mesmo laboratório e área.
      schema:
        type: string
        format: uuid
      example: 30000000-0000-4000-8000-000000000001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID estável de uma tentativa intencional de confirmação. Repetir a
        mesma ação exige a mesma chave; uma nova coleta exige uma nova chave.
      schema:
        type: string
        format: uuid
      example: 40000000-0000-4000-8000-000000000001

  headers:
    PrivateNoStore:
      description: Resposta autenticada não pode ser reutilizada como autorização.
      schema:
        type: string
        const: no-store
    CollectionLocation:
      description: Rota contextual do detalhe da coleta confirmada.
      schema:
        type: string
      example: /api/laboratories/10000000-0000-4000-8000-000000000001/areas/20000000-0000-4000-8000-000000000001/collections/30000000-0000-4000-8000-000000000001

  responses:
    InvalidInput:
      description: >-
        Body, chave idempotente ou timestamp inválido, incluindo chave
        desconhecida, horário sem offset, data futura ou precisão não aceita.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_INPUT
              message: Informe uma data e horário de ocorrência válidos com fuso explícito.
    Unauthenticated:
      description: Sessão ausente/inválida ou conta não elegível.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Não autenticado. Faça login novamente.
    Forbidden:
      description: Papel atual não possui a permissão solicitada em laboratório ativo.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Você não possui permissão para concluir esta operação.
    NotFound:
      description: >-
        Resposta uniforme para laboratório, vínculo, área ou coleta inexistente
        ou inacessível, sem confirmar a existência do recurso.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Recurso não encontrado.
    Conflict:
      description: >-
        Laboratório somente leitura, chave idempotente reutilizada com outro
        contexto/conteúdo ou conflito concorrente não recuperável.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            readOnly:
              value:
                error:
                  code: READ_ONLY
                  message: O laboratório está em modo somente leitura.
            idempotencyMismatch:
              value:
                error:
                  code: CONFLICT
                  message: A chave de confirmação já foi usada com outros dados.
    InternalError:
      description: Falha interna controlada, sem exposição de infraestrutura.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Não foi possível concluir a operação.

  schemas:
    CreateCollectionInput:
      type: object
      additionalProperties: false
      required: [occurredAt]
      properties:
        occurredAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|[+-][0-9]{2}:[0-9]{2})$'
          description: >-
            Ocorrência em perfil RFC 3339 com offset explícito e até três casas
            fracionárias. Validação semântica rejeita -00:00, datas impossíveis,
            segundo 60, offsets fora do intervalo real e instantes futuros.
          examples:
            - '2026-09-14T09:30:00-03:00'
            - '2026-09-14T12:30:00.125Z'

    AreaPublicReference:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    LaboratoryStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    LaboratoryPublicReference:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/LaboratoryStatus'

    CollectionDetail:
      type: object
      additionalProperties: false
      required: [id, occurredAt, confirmedAt, area, laboratory, readOnly]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: Timestamp reconstruído com o offset registrado na ocorrência.
          example: '2026-09-14T09:30:00.000-03:00'
        confirmedAt:
          type: string
          format: date-time
          description: Instante automático e separado da confirmação, serializado em UTC.
          example: '2026-09-14T12:35:10.456Z'
        area:
          $ref: '#/components/schemas/AreaPublicReference'
        laboratory:
          $ref: '#/components/schemas/LaboratoryPublicReference'
        readOnly:
          type: boolean

    CollectionResponse:
      type: object
      additionalProperties: false
      required: [collection]
      properties:
        collection:
          $ref: '#/components/schemas/CollectionDetail'

    ErrorCode:
      type: string
      enum:
        - INVALID_INPUT
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - READ_ONLY
        - CONFLICT

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string

    InternalErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              const: INTERNAL_ERROR
            message:
              type: string
              description: Mensagem sanitizada sem stack, consulta, banco ou detalhe interno.

  examples:
    CollectionSuccess:
      summary: Coleta geral confirmada
      value:
        collection:
          id: 30000000-0000-4000-8000-000000000001
          occurredAt: '2026-09-14T09:30:00.000-03:00'
          confirmedAt: '2026-09-14T12:35:10.456Z'
          area:
            id: 20000000-0000-4000-8000-000000000001
            name: Nascente Norte
          laboratory:
            id: 10000000-0000-4000-8000-000000000001
            name: Laboratório Hidro Norte
            status: ACTIVE
          readOnly: false
