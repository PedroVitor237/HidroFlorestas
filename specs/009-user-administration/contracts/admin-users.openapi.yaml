openapi: 3.1.0
info:
  title: IMP-009 Administrative Users API
  version: 0.1.0
  description: Planned contract; no endpoint is implemented by this documentation phase.
paths:
  /api/admin/users:
    get:
      summary: List and filter existing accounts
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/UserRole' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
      responses:
        '200': { description: Allowlisted page, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/admin/users/{userId}:
    get:
      summary: Read an existing account
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: Allowlisted account, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/admin/users/{userId}/status:
    patch:
      summary: Change another account status
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChange' } } } }
      responses: { '200': { $ref: '#/components/responses/User' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/InternalError' } }
  /api/admin/users/{userId}/role:
    patch:
      summary: Change another account global role
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleChange' } } } }
      responses: { '200': { $ref: '#/components/responses/User' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/InternalError' } }
  /api/admin/users/{userId}/audit:
    get:
      summary: Read functional administration history
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
      responses:
        '200': { description: Audit page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    UserId: { name: userId, in: path, required: true, schema: { type: string, minLength: 1 } }
  schemas:
    UserRole: { type: string, enum: [USER, ADMIN, DEVELOPER, MODERATOR] }
    UserStatus: { type: string, enum: [ACTIVE, INACTIVE, PENDING, BLOCKED] }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName, email, role, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        revision: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StatusChange:
      type: object
      additionalProperties: false
      required: [expectedStatus, expectedRevision, status, reason]
      properties:
        expectedStatus: { $ref: '#/components/schemas/UserStatus' }
        expectedRevision: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/UserStatus' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RoleChange:
      type: object
      additionalProperties: false
      required: [expectedRole, expectedRevision, role, reason]
      properties:
        expectedRole: { $ref: '#/components/schemas/UserRole' }
        expectedRevision: { type: integer, minimum: 0 }
        role: { $ref: '#/components/schemas/UserRole' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, targetUserId, actorUserId, action, beforeValue, afterValue, reason, targetRevision, createdAt]
      properties:
        id: { type: string }
        targetUserId: { type: string }
        actorUserId: { type: string }
        action: { type: string, enum: [ACCOUNT_STATUS_CHANGED, GLOBAL_ROLE_CHANGED] }
        beforeValue: { type: string }
        afterValue: { type: string }
        reason: { type: string }
        targetRevision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        nextCursor: { type: [string, 'null'] }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: [string, 'null'] }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }
  responses:
    User: { description: Updated or current no-op projection, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Missing or invalid session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Lacks authority or self-change forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Target does not exist, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Stale revision or last active ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    InternalError: { description: Controlled internal error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
