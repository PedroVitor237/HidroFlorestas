            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "get": {
        "responses": {
          "200": {
            "description": "Conjunto ou ausência",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "environmentalData"
                  ],
                  "properties": {
                    "environmentalData": {
                      "anyOf": [
                        {
                          "$ref": "#/components/schemas/PublicEnvironmentalData"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Erro sanitizado 400",
