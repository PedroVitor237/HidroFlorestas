                  "null"
                ],
                "description": "Indicador de salinidade",
                "enum": [
                  "NONE",
                  "SUSPECTED",
                  "CONFIRMED",
                  null
                ]
              }
            },
            "allOf": [
              {
                "if": {
                  "properties": {
                    "waterSourceType": {
                      "not": {
                        "enum": [
                          "SHALLOW_WELL",
                          "TUBULAR_WELL"
                        ]
                      }
                    }
                  }
                },
                "then": {
                  "properties": {
                    "wellDepthMeters": {
                      "type": "null"
                    }
                  }
                }
              }
            ]
          },
          "soil": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "soilTexture",
              "infiltrationRateMmPerHour",
              "compactionLevel",
              "erosionSigns",
              "soilExposedPercent"
            ],
            "properties": {
              "soilTexture": {
                "type": "string",
                "description": "Textura do solo",
                "enum": [
                  "SANDY",
                  "MEDIUM",
                  "CLAYEY"
                ]
              },
              "infiltrationRateMmPerHour": {
                "type": "number",
                "description": "Taxa de infiltração (mm/h)",
                "minimum": 0
              },
              "compactionLevel": {
                "type": "string",
                "description": "Compactação",
                "enum": [
                  "LOW",
                  "MEDIUM",
                  "HIGH"
                ]
              },
              "erosionSigns": {
                "type": "string",
                "description": "Sinais de erosão",
                "enum": [
                  "NONE",
                  "LAMINAR",
                  "RILLS_GULLIES"
                ]
              },
              "soilExposedPercent": {
                "type": [
                  "number",
                  "null"
                ],
                "description": "Solo exposto (%)",
                "minimum": 0,
                "maximum": 100
              }
            }
          },
          "vegetation": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "vegetationCoverPercent",
              "fragmentationLevel",
              "hasRiparianApp",
              "landscapeDegradation"
            ],
            "properties": {
              "vegetationCoverPercent": {
                "type": "number",
                "description": "Cobertura vegetal (%)",
                "minimum": 0,
                "maximum": 100
              },
              "fragmentationLevel": {
                "type": "string",
                "description": "Fragmentação",
                "enum": [
                  "LOW",
                  "MEDIUM",
                  "HIGH"
                ]
              },
              "hasRiparianApp": {
                "type": [
                  "boolean",
                  "null"
                ],
                "description": "Presença de APP ripária"
              },
              "landscapeDegradation": {
                "type": "string",
                "description": "Degradação da paisagem",
                "enum": [
                  "LOW",
                  "MEDIUM",
                  "HIGH"
                ]
              }
            }
          },
          "terrain": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "drainageDensityKmPerKm2",
              "elevationMeters",
              "slopePercent"
            ],
            "properties": {
              "drainageDensityKmPerKm2": {
                "type": [
                  "number",
                  "null"
                ],
                "description": "Densidade de drenagem (km/km²)",
                "minimum": 0
              },
              "elevationMeters": {
                "type": [
                  "number",
                  "null"
                ],
                "description": "Elevação (m)"
              },
              "slopePercent": {
                "type": [
                  "number",
                  "null"
                ],
                "description": "Declividade (%)",
                "minimum": 0
              }
            }
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "details": {
                "type": "object"
              }
            }
          }
        }
      }
    }
  }
}
