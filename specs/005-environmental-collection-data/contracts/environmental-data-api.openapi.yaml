  "paths": {
    "/api/laboratories/{laboratoryId}/areas/{areaId}/collections/{collectionId}/environmental-data": {
      "parameters": [
        {
          "name": "laboratoryId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "areaId",
          "in": "path",
          "required": true,
